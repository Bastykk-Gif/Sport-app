<style>
:root{color-scheme:light dark;--bg:#f6f5f2;--card:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--line:#e3e1dc;--btn:#2a78d6;--err:#b3261e}

body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}

input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink)}
button{margin-top:12px;width:100%;font:inherit;font-weight:600;padding:10px;border:0;border-radius:8px;background:var(--btn);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}#err{color:var(--err);font-size:14px;min-height:20px;margin-top:8px}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
</style></head><body>

document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();const btn=document.getElementById('go'),err=document.getElementById('err');
  err.textContent='';btn.disabled=true;btn.textContent='Ouverture...';
  try{
    const pw=document.getElementById('pw').value.trim().toLowerCase();
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(P.s),iterations:P.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(P.i)},key,u(P.c));
    const f=document.createElement('iframe');f.setAttribute('sandbox','allow-scripts');f.srcdoc=new TextDecoder().decode(pt);
    document.body.innerHTML='';document.body.appendChild(f);
  }catch(x){err.textContent='Mot de passe incorrect.';btn.disabled=false;btn.textContent='Ouvrir';}
});
